# GenomeForge — example parameter file for a generic SLURM/Singularity site. Copy, edit, then:
#   nextflow run main.nf -profile slurm -params-file site.params.yaml --input samplesheet.csv
# On the Noguchi HPC none of this is needed: -profile noguchi carries the paths.

input:  null                       # --input samplesheet.csv  (bin/make_samplesheet.py)
outdir: results

fasta: /refs/GRCh38/GRCh38_no_alt.chr.fa          # chr-style no-alt, bwa-mem2 index + .fai + .dict co-located
calling_regions: /refs/GRCh38/wgs_calling_regions.hg38.interval_list
scatter_count: 48

dbsnp:        /refs/GRCh38/dbsnp.vcf.gz
mills:        /refs/GRCh38/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz
known_indels: /refs/GRCh38/Homo_sapiens_assembly38.known_indels.vcf.gz
hapmap:       /refs/GRCh38/hapmap_3.3.hg38.vcf.gz
omni:         /refs/GRCh38/1000G_omni2.5.hg38.vcf.gz
g1000:        /refs/GRCh38/1000G_phase1.snps.high_confidence.hg38.vcf.gz
clinvar:      /refs/GRCh38/clinvar.vcf.gz
gnomad_dir:   /refs/GRCh38/gnomad
gnomad_pattern: gnomad.exomes.v4.1.sites.{chrom}.vcf.bgz
somalier_sites: /refs/GRCh38/sites.hg38.vcf.gz
vep_cache:    /refs/vep
vep_release:  112

sequencing_center: null        # read-group CN tag, e.g. NOVOGENE
filtering: vqsr
trim: true
archive_cram: false

callforge_sif: /opt/callforge/images/callforge.sif
annotate_sif:  /opt/callforge/images/callforge-annotate.sif
cohortqc_sif:  /opt/callforge/images/callforge-cohortqc.sif
burden_sif:    /opt/callforge/images/callforge-burden.sif
bind_paths:    /refs,/opt,/data
slurm_partition: compute
slurm_account: null
